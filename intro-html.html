<!DOCTYPE html>  <!-- serve para garantir que o navegador interprete o código corretamente, na versão mais atual do HTML, que é a versão 5 -->

<!-- HTML - é a raiz do documento, ou seja, tudo começa aqui. Todo o conteúdo da página fica dentro do HTML -->
<html lang="pt-br"> <!-- lang/language/idioma - Indica o idioma principal da página -->
    <head> <!-- o head/cabeça do site serve pra guardar informações sobre a página, pensa nela como a área de configuração do site -->
        
        <meta charset="UTF-8"> <!-- Permite configurar o site para aceitar acentos, caracteres especiais, emojis -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title> <!-- title/título - serve para definir o título da aba do navegador -->
    
    </head>

    <body>
        <!-- body/corpo - é a parte do HTML é onde fica todo o conteúdo visível do site -->
        
    </body>
</html>
